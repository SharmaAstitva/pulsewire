name: News Pipeline

# Runs the full ingest -> AI -> rank pipeline every 3 hours and publishes the
# resulting SQLite database to the `data` branch. The API downloads it from there.
on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
    inputs:
      ai_backend:
        description: "AI backend"
        type: choice
        options: [transformers, lite]
        default: transformers

permissions:
  contents: write

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          if [ "${{ inputs.ai_backend || 'transformers' }}" = "transformers" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
            pip install -r requirements-ml.txt
          fi

      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1

      - name: Restore previous snapshot
        run: |
          mkdir -p data
          if git fetch --depth=1 origin +data:refs/remotes/origin/data 2>/dev/null; then
            git show origin/data:pulsewire.db > data/pulsewire.db || rm -f data/pulsewire.db
            echo "Restored previous snapshot"
          else
            echo "No snapshot yet, starting fresh"
          fi

      - name: Run pipeline
        env:
          AI_BACKEND: ${{ inputs.ai_backend || 'transformers' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m pipeline.run

      - name: Publish snapshot to the data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/snapshot
          cp data/pulsewire.db /tmp/snapshot/
          cd /tmp/snapshot
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pulsewire.db
          git commit -q -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:data
