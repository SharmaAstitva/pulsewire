# Render Blueprint for the API. The heavy AI pipeline runs on GitHub Actions,
# so this free web service only serves the published snapshot.
services:
  - type: web
    name: pulsewire-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
